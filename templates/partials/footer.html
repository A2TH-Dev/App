<footer class="w-full bg-surface-container-low mt-unit-xl border-t border-outline-variant/20">
  <div class="max-w-[1200px] mx-auto px-margin-mobile lg:px-margin-desktop py-unit-xl flex flex-col md:flex-row justify-between items-center gap-unit-md text-center md:text-left">
    <div class="flex flex-col gap-unit-xs">
      <span class="font-headline-md text-[20px] text-on-surface">{{SITE_BRAND}}</span>
      <p class="font-body-sm text-body-sm text-on-surface-variant">{{SITE_FOOTER_NOTE}}</p>
    </div>
    <div class="flex items-center gap-unit-lg">
      <a class="flex items-center gap-unit-xs font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors" href="https://github.com/{{GITHUB_USER}}">
        <span class="material-symbols-outlined text-[18px]">code</span>View on GitHub
      </a>
      <span class="font-body-sm text-body-sm text-on-tertiary-fixed-variant">© {{YEAR}} {{SITE_BRAND}}</span>
    </div>
  </div>
</footer>
<button id="back-to-top" type="button" aria-label="Kembali ke atas" class="fixed bottom-6 right-6 z-40 w-11 h-11 rounded-full bg-primary text-on-primary shadow-xl shadow-primary/30 flex items-center justify-center opacity-0 pointer-events-none translate-y-2 transition-all duration-300 hover:scale-110">
  <span class="material-symbols-outlined text-[22px]">arrow_upward</span>
</button>
<script>
(function () {
  var btn = document.getElementById('back-to-top');
  if (!btn) return;
  function toggle() {
    var show = window.scrollY > 480;
    btn.classList.toggle('opacity-0', !show);
    btn.classList.toggle('pointer-events-none', !show);
    btn.classList.toggle('translate-y-2', !show);
  }
  window.addEventListener('scroll', toggle, { passive: true });
  toggle();
  btn.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
<script>
(function () {
  var els = document.querySelectorAll('.reveal');
  if (!els.length) return;
  if (!('IntersectionObserver' in window)) {
    els.forEach(function (el) { el.classList.add('is-visible'); });
    return;
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
  els.forEach(function (el) { io.observe(el); });
})();
</script>
