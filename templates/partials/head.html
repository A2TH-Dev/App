<style>
  @layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}}
  ::-webkit-scrollbar{display:none;}
  .fade-in{animation:fadeIn .6s cubic-bezier(0.22,1,0.36,1) both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){.fade-in{animation:none;}}
  .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s cubic-bezier(0.22,1,0.36,1),transform .7s cubic-bezier(0.22,1,0.36,1);}
  .reveal.is-visible{opacity:1;transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){.reveal{opacity:1;transform:none;transition:none;}}
</style>
